name: Test Vercel fallback deployment

on:
  push:
    branches: ["main"]
    paths:
      - "vercel-test-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and verify public production URL
        shell: bash
        run: |
          set -u
          mkdir -p deploy-status /tmp/vercel-test
          cp prospects/sarl-convenant/index.html /tmp/vercel-test/index.html
          SHA=$(sha1sum /tmp/vercel-test/index.html | awk '{print $1}')
          SIZE=$(wc -c < /tmp/vercel-test/index.html | tr -d ' ')

          TOKEN_PRESENT=false
          [ -n "${VERCEL_TOKEN:-}" ] && TOKEN_PRESENT=true
          UPLOAD_CODE="000"
          DEPLOY_CODE="000"
          DEPLOY_ID=""
          UNIQUE_URL=""
          PUBLIC_URL=""
          STATE="unknown"
          HTTP_CODE="000"
          CONTENT_TYPE=""
          RENDERING_OK=false
          ALIASES=""

          if [ "$TOKEN_PRESENT" = "true" ]; then
            UPLOAD_CODE=$(curl -sS -o /tmp/upload.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "x-vercel-digest: $SHA" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @/tmp/vercel-test/index.html \
              https://api.vercel.com/v2/files || true)

            if [ "$UPLOAD_CODE" = "200" ] || [ "$UPLOAD_CODE" = "201" ]; then
              BODY=$(jq -nc --arg name "prospector-fallback-test" --arg sha "$SHA" --argjson size "$SIZE" '{name:$name,files:[{file:"index.html",sha:$sha,size:$size}],target:"production",projectSettings:{framework:null}}')
              DEPLOY_CODE=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY" \
                https://api.vercel.com/v13/deployments || true)

              if [ "$DEPLOY_CODE" = "200" ] || [ "$DEPLOY_CODE" = "201" ]; then
                DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
                HOST=$(jq -r '.url // empty' /tmp/deploy.json)
                [ -n "$HOST" ] && UNIQUE_URL="https://$HOST"

                for i in {1..30}; do
                  curl -sS -o /tmp/state.json -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOY_ID" || true
                  STATE=$(jq -r '.readyState // .status // "unknown"' /tmp/state.json 2>/dev/null || echo unknown)
                  [ "$STATE" = "READY" ] && break
                  [ "$STATE" = "ERROR" ] && break
                  sleep 4
                done

                if [ "$STATE" = "READY" ]; then
                  curl -sS -o /tmp/aliases.json -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$DEPLOY_ID/aliases" || true
                  curl -sS -o /tmp/domains.json -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/prospector-fallback-test/domains" || true

                  {
                    jq -r '.aliases[]? | if type=="string" then . else (.alias // .domain // .name // empty) end' /tmp/aliases.json 2>/dev/null || true
                    jq -r '.domains[]?.name // empty' /tmp/domains.json 2>/dev/null || true
                    [ -n "$UNIQUE_URL" ] && echo "$UNIQUE_URL"
                  } | sed '/^$/d' | awk '!seen[$0]++' > /tmp/candidates.txt

                  ALIASES=$(paste -sd ',' /tmp/candidates.txt 2>/dev/null || true)

                  while IFS= read -r candidate; do
                    [ -z "$candidate" ] && continue
                    if [[ "$candidate" != http* ]]; then candidate="https://$candidate"; fi
                    RESULT=$(curl -L -sS -o /tmp/page.html -w "%{http_code}\n%{content_type}" --max-time 30 "$candidate" || true)
                    CODE=$(printf '%s\n' "$RESULT" | sed -n '1p')
                    TYPE=$(printf '%s\n' "$RESULT" | sed -n '2p')
                    if [ "$CODE" = "200" ] && [[ "$TYPE" == text/html* ]] && grep -Fqi 'SARL CONVENANT' /tmp/page.html; then
                      PUBLIC_URL="$candidate"
                      HTTP_CODE="$CODE"
                      CONTENT_TYPE="$TYPE"
                      RENDERING_OK=true
                      break
                    fi
                    HTTP_CODE="$CODE"
                    CONTENT_TYPE="$TYPE"
                  done < /tmp/candidates.txt
                fi
              fi
            fi
          fi

          UPLOAD_ERROR=$(jq -c '.error // empty' /tmp/upload.json 2>/dev/null || true)
          DEPLOY_ERROR=$(jq -c '.error // empty' /tmp/deploy.json 2>/dev/null || true)
          jq -n \
            --argjson token_present "$TOKEN_PRESENT" \
            --arg upload_code "$UPLOAD_CODE" \
            --arg deploy_code "$DEPLOY_CODE" \
            --arg deploy_id "$DEPLOY_ID" \
            --arg unique_url "$UNIQUE_URL" \
            --arg public_url "$PUBLIC_URL" \
            --arg aliases "$ALIASES" \
            --arg state "$STATE" \
            --arg http_code "$HTTP_CODE" \
            --arg content_type "$CONTENT_TYPE" \
            --argjson rendering_ok "$RENDERING_OK" \
            --arg upload_error "$UPLOAD_ERROR" \
            --arg deploy_error "$DEPLOY_ERROR" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{token_present:$token_present,upload_code:$upload_code,deploy_code:$deploy_code,deploy_id:$deploy_id,unique_url:$unique_url,public_url:$public_url,aliases:$aliases,state:$state,http_code:$http_code,content_type:$content_type,rendering_ok:$rendering_ok,upload_error:$upload_error,deploy_error:$deploy_error,checked_at:$checked_at}' > deploy-status/vercel-fallback-test.json
          cat deploy-status/vercel-fallback-test.json

      - name: Save test result
        shell: bash
        run: |
          git config user.name "prospector-bot"
          git config user.email "prospector-bot@users.noreply.github.com"
          git add deploy-status/vercel-fallback-test.json
          git commit -m "Record Vercel fallback test result" || exit 0
          git push
