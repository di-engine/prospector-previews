name: Deploy ELERTIM preview to Netlify

on:
  push:
    branches: ["main"]
    paths:
      - "elertim/**"
      - ".github/workflows/netlify-elertim.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy anonymous Netlify preview
        id: deploy
        shell: bash
        run: |
          netlify deploy --allow-anonymous --dir ./elertim --no-build --json > /tmp/netlify.json
          cat /tmp/netlify.json
          URL=$(jq -r '.url // .deploy_url // .ssl_url // .deploy_ssl_url // empty' /tmp/netlify.json)
          if [ -z "$URL" ]; then
            echo "No Netlify URL found in deployment output" >&2
            exit 1
          fi
          echo "$URL" > netlify-preview-elertim.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Save preview URL in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify-preview-elertim.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update ELERTIM Netlify preview URL"
          git push
