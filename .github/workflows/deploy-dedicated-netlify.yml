name: Deploy dedicated Netlify prospect

on:
  push:
    branches: ["main"]
    paths:
      - "prospects/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve prospect
        id: prospect
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          SLUG=$(printf '%s\n' "$CHANGED" | awk -F/ '/^prospects\/[^/]+\// {print $2; exit}')
          test -n "$SLUG"
          META="prospects/$SLUG/prospect.json"
          test -f "$META"
          DISPLAY_NAME=$(jq -r '.display_name' "$META")
          SITE_NAME=$(jq -r '.site_name' "$META")
          EXPECTED_TEXT=$(jq -r '.expected_text' "$META")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "site_name=$SITE_NAME" >> "$GITHUB_OUTPUT"
          echo "expected_text=$EXPECTED_TEXT" >> "$GITHUB_OUTPUT"

      - name: Validate Netlify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/user > /tmp/netlify-user.json
          jq -e '.id' /tmp/netlify-user.json >/dev/null

      - name: Resolve or create Netlify project
        id: site
        shell: bash
        run: |
          set -euo pipefail
          SLUG='${{ steps.prospect.outputs.slug }}'
          REQUESTED='${{ steps.prospect.outputs.site_name }}'
          STATUS="deploy-status/$SLUG.json"
          SITE_ID=""
          SITE_NAME=""
          SITE_URL=""

          if [ -f "$STATUS" ] && jq -e '.site_id' "$STATUS" >/dev/null 2>&1; then
            SITE_ID=$(jq -r '.site_id' "$STATUS")
            SITE_NAME=$(jq -r '.site_name' "$STATUS")
            SITE_URL=$(jq -r '.url' "$STATUS")
          else
            for CANDIDATE in "$REQUESTED" "${REQUESTED}-24" "${REQUESTED}-dordogne" "${REQUESTED}-$(date +%y%m%d%H%M)"; do
              LOOKUP_CODE=$(curl -sS -o /tmp/site-lookup.json -w "%{http_code}" \
                -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                "https://api.netlify.com/api/v1/sites/${CANDIDATE}.netlify.app" || true)
              if [ "$LOOKUP_CODE" = "200" ]; then
                SITE_ID=$(jq -r '.id' /tmp/site-lookup.json)
                SITE_NAME=$(jq -r '.name' /tmp/site-lookup.json)
                SITE_URL=$(jq -r '.ssl_url // .url' /tmp/site-lookup.json)
                break
              fi

              BODY=$(jq -nc --arg name "$CANDIDATE" '{name:$name}')
              CREATE_CODE=$(curl -sS -o /tmp/site-create.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY" \
                https://api.netlify.com/api/v1/sites || true)
              if [ "$CREATE_CODE" = "200" ] || [ "$CREATE_CODE" = "201" ]; then
                SITE_ID=$(jq -r '.id' /tmp/site-create.json)
                SITE_NAME=$(jq -r '.name' /tmp/site-create.json)
                SITE_URL=$(jq -r '.ssl_url // .url' /tmp/site-create.json)
                break
              fi
            done
          fi

          test -n "$SITE_ID"
          test -n "$SITE_NAME"
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            SITE_URL="https://${SITE_NAME}.netlify.app"
          fi
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "site_name=$SITE_NAME" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Create ZIP deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          SLUG='${{ steps.prospect.outputs.slug }}'
          SITE_ID='${{ steps.site.outputs.site_id }}'
          test -f "prospects/$SLUG/index.html"
          cd "prospects/$SLUG"
          zip -q /tmp/prospect-site.zip index.html
          cd - >/dev/null
          DEPLOY_CODE=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/prospect-site.zip \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys")
          test "$DEPLOY_CODE" = "200" -o "$DEPLOY_CODE" = "201"
          DEPLOY_ID=$(jq -r '.id' /tmp/deploy.json)
          test -n "$DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Netlify deploy ready
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ID='${{ steps.deploy.outputs.deploy_id }}'
          READY=false
          for i in {1..36}; do
            curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" > /tmp/deploy-state.json
            STATE=$(jq -r '.state' /tmp/deploy-state.json)
            if [ "$STATE" = "ready" ]; then READY=true; break; fi
            if [ "$STATE" = "error" ]; then cat /tmp/deploy-state.json; exit 1; fi
            sleep 5
          done
          test "$READY" = "true"

      - name: Verify public site and save status
        shell: bash
        run: |
          set -euo pipefail
          SLUG='${{ steps.prospect.outputs.slug }}'
          SITE_ID='${{ steps.site.outputs.site_id }}'
          SITE_NAME='${{ steps.site.outputs.site_name }}'
          URL='${{ steps.site.outputs.site_url }}'
          EXPECTED='${{ steps.prospect.outputs.expected_text }}'
          OK=false
          for i in {1..24}; do
            CODE=$(curl -L -sS -o /tmp/public.html -w "%{http_code}" --max-time 30 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -Fqi "$EXPECTED" /tmp/public.html; then OK=true; break; fi
            sleep 5
          done
          test "$OK" = "true"
          mkdir -p deploy-status
          jq -n \
            --arg prospect '${{ steps.prospect.outputs.display_name }}' \
            --arg slug "$SLUG" \
            --arg site_id "$SITE_ID" \
            --arg site_name "$SITE_NAME" \
            --arg url "$URL" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{prospect:$prospect,slug:$slug,site_id:$site_id,site_name:$site_name,url:$url,http_status:200,content_verified:true,verified_at:$verified_at}' \
            > "deploy-status/$SLUG.json"

      - name: Save deployment result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prospector-bot"
          git config user.email "prospector-bot@users.noreply.github.com"
          git add "deploy-status/${{ steps.prospect.outputs.slug }}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Verify dedicated Netlify preview for ${{ steps.prospect.outputs.display_name }}"
            git push
          fi
