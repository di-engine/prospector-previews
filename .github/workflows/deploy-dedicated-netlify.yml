name: Deploy prospect with hosting fallback

on:
  push:
    branches: ["main"]
    paths:
      - "prospects/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve prospect
        id: prospect
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          SLUG=$(printf '%s\n' "$CHANGED" | awk -F/ '/^prospects\/[^/]+\// {print $2; exit}')
          if [ -z "$SLUG" ]; then SLUG="sarl-convenant"; fi
          test -f "prospects/$SLUG/prospect.json"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "display_name=$(jq -r '.display_name' "prospects/$SLUG/prospect.json")" >> "$GITHUB_OUTPUT"

      - name: Deploy and validate hosting
        id: hosting
        shell: bash
        run: |
          set +e
          bash scripts/deploy-prospect.sh '${{ steps.prospect.outputs.slug }}'
          CODE=$?
          if [ "$CODE" = "0" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Save deployment result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prospector-bot"
          git config user.email "prospector-bot@users.noreply.github.com"
          git add "deploy-status/${{ steps.prospect.outputs.slug }}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Record hosting result for ${{ steps.prospect.outputs.display_name }}"
            git push
          fi

      - name: Block outreach when both hosts fail
        if: steps.hosting.outputs.success != 'true'
        shell: bash
        run: |
          echo "Neither Netlify nor Vercel produced a verified public HTML site."
          exit 1
