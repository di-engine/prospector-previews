name: Verify RENOVA-POSE 24 Netlify preview

on:
  push:
    branches: ["main"]
    paths:
      - "renova-pose-24/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Netlify and verify public page
        shell: bash
        run: |
          set -euo pipefail
          URL="https://elertim.netlify.app/renova-pose-24/"
          OK=false
          for i in {1..18}; do
            CODE=$(curl -L -sS -o /tmp/renova.html -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q "RENOVA-POSE 24" /tmp/renova.html; then
              OK=true
              break
            fi
            sleep 10
          done
          if [ "$OK" != "true" ]; then
            echo "Netlify preview verification failed"
            exit 1
          fi
          mkdir -p deploy-status
          printf '{"prospect":"RENOVA-POSE 24","url":"%s","http_status":200,"content_verified":true,"verified_at":"%s"}\n' "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/renova-pose-24.json
      - name: Record verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status/renova-pose-24.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify RENOVA-POSE 24 Netlify preview"
            git push
          fi
